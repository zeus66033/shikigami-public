name: Shikigami Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'run'
        type: choice
        options:
          - run
          - announce
          - walk
      duration_minutes:
        description: 'Max runtime in minutes (max 120)'
        required: false
        default: '120'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - name: Checkout public scaffolding
        uses: actions/checkout@v4

      - name: Checkout private bot logic
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: bot

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bot dependencies
        working-directory: bot
        run: |
          npm init -y
          npm install mineflayer@4.37.1 minecraft-protocol@1.66.2 minecraft-data@3.113.2 mineflayer-pathfinder mineflayer-collectblock mineflayer-armor-manager mineflayer-tool minecraft-protocol-forge prismarine-item prismarine-nbt vec3

      - name: Write world.txt from secrets
        working-directory: bot
        run: |
          printf '%s\n' \
            "${{ secrets.MC_SERVER }}" \
            "${{ secrets.MC_PORT }}" \
            "${{ secrets.GROQ_API_KEY }}" \
            "${{ secrets.MC_VERSION }}" \
            "${{ secrets.MC_ADAPTER }}" \
            "${{ secrets.COMMANDER_KEY }}" \
            "${{ secrets.COMMANDER_NAME }}" \
            > world.txt

      - name: Start tunnel reporter (background)
        env:
          PANEL_PORT: '4590'
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node tunnel-reporter.js > /tmp/tunnel.log 2>&1 &
          echo "Tunnel PID: $!"

      - name: Start bot in background for debug
        working-directory: bot
        env:
          LICENSE_BYPASS: '1'
          TUNNEL_MODE: '1'
          PANEL_PORT: '4590'
          SHIKIGAMI_NAME: ${{ secrets.SHIKIGAMI_NAME }}
          BOT_TASK: ${{ github.event.inputs.task || 'run' }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '120' }}
        run: |
          TIMEOUT=$(( ${DURATION_MINUTES:-120} * 60 ))
          timeout $TIMEOUT node shikigami.js > /tmp/bot.log 2>&1 &
          echo "Bot PID: $!"

      - name: Wait for bot and tunnel to come up
        run: |
          echo "Waiting 30s for bot and tunnel to initialize..."
          sleep 30

      - name: Debug - check what is listening
        run: |
          echo "=== Processes ==="
          ps aux | grep node || echo "(no node processes)"
          echo ""
          echo "=== Listening ports ==="
          ss -tlnp | grep -E "4590|LISTEN" || echo "(nothing listening)"
          echo ""
          echo "=== Curl panel ==="
          curl -v --max-time 5 http://localhost:4590 2>&1 || echo "(panel not reachable)"
          echo ""
          echo "=== Bot log ==="
          cat /tmp/bot.log || echo "(no bot log)"
          echo ""
          echo "=== Tunnel log ==="
          cat /tmp/tunnel.log || echo "(no tunnel log)"

      - name: Keep alive for remaining duration
        run: |
          DURATION_MINUTES=${{ github.event.inputs.duration_minutes || '120' }}
          ELAPSED=1
          TIMEOUT=$(( DURATION_MINUTES - ELAPSED ))
          echo "Keeping job alive for ${TIMEOUT} more minutes..."
          sleep $(( TIMEOUT * 60 )) || true

      - name: Print final logs
        if: always()
        run: |
          echo "=== Final bot log ==="
          cat /tmp/bot.log || echo "(no log)"
          echo "=== Final tunnel log ==="
          cat /tmp/tunnel.log || echo "(no log)"